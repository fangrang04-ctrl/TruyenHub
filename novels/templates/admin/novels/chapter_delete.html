{% extends "admin/base_site.html" %}

{% block content %}

<div style="
    max-width:700px;
    margin:40px auto;
    background:white;
    border:1px solid #ddd;
    border-radius:8px;
    padding:35px;
">

    <h1>
        Xóa chương
    </h1>

    <p style="
        margin-top:20px;
        font-size:16px;
    ">

        Bạn có chắc muốn xóa:

        <strong>
            Chương {{ chapter.chapter_number }} -
            {{ chapter.title }}
        </strong>

        ?

    </p>

    <p style="
        color:#a00;
        margin-top:10px;
    ">

        Nội dung chương sẽ bị xóa vĩnh viễn.

    </p>


    <form
        method="post"
        style="
            margin-top:30px;
            display:flex;
            gap:10px;
        "
    >

        {% csrf_token %}


        <button
            type="submit"
            style="
                background:#ba2121;
                color:white;
                border:none;
                padding:11px 20px;
                border-radius:5px;
                cursor:pointer;
                font-weight:600;
            "
        >
            🗑 Xác nhận xóa
        </button>


        <a
            href="{% url 'admin:novels_novel_manage_chapters' novel.pk %}"
            style="
                border:1px solid #bbb;
                padding:10px 20px;
                border-radius:5px;
                color:#555;
            "
        >
            Hủy
        </a>

    </form>

</div>

{% endblock %}
